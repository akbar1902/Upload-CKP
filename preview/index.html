<div class="previewbar" role="banner" aria-label="Kontrol pratinjau">
  <div class="previewbar__brand">
    <span class="spark" aria-hidden="true"></span>
    SIKAP
    <small>Pratinjau Redesign UI</small>
  </div>
  <div class="preview-roles" role="group" aria-label="Pratinjau sebagai peran">
    <button class="preview-role is-active" data-role="anggota">Anggota</button>
    <button class="preview-role" data-role="ketua_tim">Ketua Tim</button>
    <button class="preview-role" data-role="pimpinan">Pimpinan</button>
    <button class="preview-role" data-role="admin">Admin</button>
  </div>
  <div class="previewbar__spacer"></div>
  <div class="previewbar__actions">
    <button class="pv-btn" data-action="cmd" title="Pencarian cepat (Ctrl+K)">
      <svg class="i" style="width:13px;height:13px"><use href="#i-search"/></svg>
      <span>Cari</span>
      <kbd style="font-size:9px;font-weight:800;padding:2px 5px;border-radius:4px;background:rgba(239,231,212,.14)">Ctrl K</kbd>
    </button>
    <button class="pv-btn" data-action="index">
      <svg class="i" style="width:13px;height:13px"><use href="#i-grid"/></svg>
      <span>Semua Layar</span>
    </button>
    <button class="pv-btn" data-action="theme" title="Ganti tema terang/gelap">
      <svg class="i" style="width:13px;height:13px"><use href="#i-moon"/></svg>
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════
     APP SHELL
     ══════════════════════════════════════════════════════════ -->
<div id="app-shell">
  <div class="sb-scrim" data-action="close-sidebar" aria-hidden="true"></div>

  <aside class="app-sidebar" aria-label="Navigasi utama">
    <div class="app-sidebar__brand">
      <img class="wordmark" src="assets/sikap-logo-cream.svg" alt="SIKAP" />
      <img class="mark" src="assets/sikap-mark.svg" alt="SIKAP" style="filter:brightness(0) invert(1)" />
    </div>

    <div class="app-sidebar__context">
      <div class="ctx-label">Unit kerja</div>
      <div class="ctx-value">
        <svg class="i"><use href="#i-building"/></svg>
        BPS Kabupaten Belitung
      </div>
    </div>

    <div class="app-sidebar__scroll">
      <nav id="sidebar-nav" aria-label="Menu aplikasi"></nav>
    </div>

    <div class="app-sidebar__footer">
      <button class="nav-item" data-action="collapse">
        <svg class="i"><use href="#i-chevron-left"/></svg><span>Ciutkan Sidebar</span>
      </button>
      <button class="nav-item" data-action="modal" data-modal="change-password">
        <svg class="i"><use href="#i-key"/></svg><span>Ganti Password</span>
      </button>
      <button class="nav-item" data-action="install">
        <svg class="i"><use href="#i-download"/></svg><span>Pasang Aplikasi</span>
      </button>
      <button class="nav-item" data-action="logout">
        <svg class="i"><use href="#i-logout"/></svg><span>Keluar</span>
      </button>
      <div class="sidebar-user">
        <span class="avatar avatar--sm" id="sidebar-avatar">DL</span>
        <span class="sidebar-user__meta">
          <span class="sidebar-user__name" id="sidebar-name">Dwi Lestari</span>
          <span class="sidebar-user__role" id="sidebar-role">Statistisi Ahli Muda</span>
        </span>
        <span class="sidebar-user__status" title="Online"></span>
      </div>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar" role="banner">
      <button class="topbar__menu" data-action="menu" aria-label="Buka menu">
        <svg class="i" style="width:18px;height:18px"><use href="#i-list"/></svg>
      </button>
      <nav class="topbar__crumbs" id="topbar-crumbs" aria-label="Breadcrumb">
        <span>Ruang kerja</span><span class="sep">/</span><span class="current">Dashboard</span>
      </nav>
      <div class="topbar__spacer"></div>
      <button class="topbar__search" data-action="cmd" aria-label="Pencarian cepat">
        <svg class="i"><use href="#i-search"/></svg>
        <span>Cari apa pun…</span>
        <kbd>Ctrl K</kbd>
      </button>
      <span class="topbar__date" id="topbar-date">Minggu, 18 Oktober 2026 · 09.42 WIB</span>
      <div class="topbar__actions">
        <div style="position:relative">
          <button class="icon-btn" data-action="notif" aria-label="Notifikasi" aria-expanded="false" id="notif-btn">
            <svg class="i"><use href="#i-bell"/></svg>
            <span class="icon-btn__dot" id="notif-dot">3</span>
          </button>
          <div class="popover" id="notif-panel" role="dialog" aria-label="Riwayat notifikasi"></div>
        </div>
        <button class="icon-btn" data-action="theme" aria-label="Ganti tema" title="Terang / gelap">
          <svg class="i theme-icon"><use href="#i-moon"/></svg>
        </button>
        <div class="topbar__user">
          <span class="avatar avatar--sm" id="topbar-avatar">DL</span>
          <span>
            <span class="name" id="topbar-name">Dwi Lestari</span><br />
            <span class="role" id="topbar-role">Anggota</span>
          </span>
        </div>
      </div>
    </header>

    <main class="content" id="screen-root" role="main"></main>
  </div>
</div>

<!-- Auth screens (login / reset) render here -->
<div id="auth-root"></div>

<!-- Komponen global -->
<div class="modal-backdrop" id="modal-root" role="presentation"></div>
<div class="cmd-backdrop" id="cmd-root" role="presentation"></div>
<div class="toast-stack" id="toast-stack" aria-live="polite"></div>

<script src="screens-core.js"></script>
<script src="screens-review.js"></script>
<script src="screens-admin.js"></script>
<script src="app.js"></script>
